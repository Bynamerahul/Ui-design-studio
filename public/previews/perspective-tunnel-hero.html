<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perspective Tunnel Hero · UI Design Studio Preview</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;background:#070611;color:white;font-family:'DM Sans',sans-serif}.scene{position:relative;width:100%;height:100svh;perspective:1100px;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 50%,#17153a 0,#090814 55%,#040409 100%)}.scene:before{content:'';position:absolute;inset:0;background-image:radial-gradient(#8876c345 1px,transparent 1px);background-size:28px 28px;mask-image:radial-gradient(ellipse,#000 38%,transparent 82%);pointer-events:none}.scene:after{content:'';position:absolute;inset:0;background:radial-gradient(circle,#6555d221,transparent 56%);pointer-events:none}.top{position:absolute;z-index:30;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:25px 5vw;font-size:10px;letter-spacing:.18em;font-weight:700}.top a{color:#e9e5ff;text-decoration:none;padding:10px 15px;border:1px solid #ffffff50;border-radius:30px;background:#17132b99}.ring{position:absolute;left:50%;top:50%;width:50vmin;aspect-ratio:1;border:1px solid #8d77d02b;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.ring.big{width:79vmin;border-style:dashed;border-color:#ffffff22}.center{position:absolute;left:50%;top:50%;width:min(90%,640px);text-align:center;transform:translate(-50%,-50%);pointer-events:none;z-index:1;transition:transform .2s,opacity .2s}.center small{font-size:11px;letter-spacing:.4em;color:#ac9aff;font-weight:700}.center h1{font-size:clamp(54px,9vw,126px);line-height:.84;letter-spacing:-.1em;margin:17px 0 20px;background:linear-gradient(#fff 30%,#7a7595);color:transparent;background-clip:text}.center p{max-width:350px;margin:auto;color:#c9c6d7;font-size:15px;line-height:1.6}.cards{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}.card{position:absolute;left:50%;top:50%;width:clamp(135px,18vw,270px);aspect-ratio:4/5;border:1px solid #ffffff3d;border-radius:18px;overflow:hidden;box-shadow:0 28px 65px #000a;pointer-events:auto;transform-style:preserve-3d;will-change:transform,opacity;cursor:pointer;background:#211b35;color:#fff}.card .art{position:absolute;inset:0;background:var(--art);transition:transform .5s}.card:hover .art{transform:scale(1.09)}.card:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 35%,#000b)}.card span{position:absolute;z-index:2;left:18px;bottom:17px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-shadow:0 2px 12px #000}.card:focus-visible{outline:3px solid #bba8ff;outline-offset:5px}.cue{position:absolute;bottom:27px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.25em;color:#c9c3e0;text-transform:uppercase;text-align:center;pointer-events:none;z-index:20}.cue:after{content:'';display:block;margin:12px auto 0;width:1px;height:29px;background:linear-gradient(#a795fc,transparent)}.meter{position:absolute;right:5vw;top:50%;transform:translateY(-50%);height:130px;width:2px;background:#ffffff3b;z-index:20}.meter i{display:block;width:2px;background:#bcabff;height:var(--progress);box-shadow:0 0 10px #a998ff}.toast{position:absolute;z-index:25;top:14%;left:50%;transform:translateX(-50%);border:1px solid #ffffff55;border-radius:100px;background:#151325d9;backdrop-filter:blur(12px);padding:11px 18px;font-size:12px;opacity:0;transition:opacity .2s}.toast[data-show=true]{opacity:1}@media(max-width:700px){.card{width:clamp(135px,38vw,190px)}.center h1{font-size:clamp(55px,16vw,90px)}.center p{font-size:12px}.top{font-size:8px}.meter{right:15px}.cue{font-size:8px}}
</style></head><body><main class="scene" id="scene"><div class="top"><span>UI Design Studio / 05</span><a href="/#design-trail">Back to collection ↗</a></div><div class="ring"></div><div class="ring big"></div><div class="center" id="center"><small>SPATIAL INTERACTION / 005</small><h1>INTO THE<br>ETHER.</h1><p>Scroll to travel through a field of images. Move your cursor to shift your point of view.</p></div><div class="cards" id="cards"></div><div class="meter"><i id="meter"></i></div><div class="cue" id="cue">Scroll to explore</div><div class="toast" id="toast" role="status"></div></main><script>
const items=[['Chroma I','radial-gradient(circle at 75% 25%,#e6ddfc,transparent 35%),linear-gradient(130deg,#6851ad,#ea9ec1,#211843)'],['Prism III','conic-gradient(from 30deg,#e6b9e7,#5367c1,#111943,#9abdd0,#e6b9e7)'],['Ether IV','radial-gradient(circle at 30% 45%,#d6fff6,#77a5b8 25%,#1e2759 52%,#b47fc4)'],['Quantum V','linear-gradient(125deg,#100a29,#804691 32%,#e6b7b0 55%,#46468c)'],['Nebula VI','radial-gradient(circle at 55% 44%,#fed1ec,#8956b7 35%,#11123b 72%)'],['Cyber VII','linear-gradient(145deg,#203d57,#90bfc9,#ae92cc,#2e1550)'],['Flux VIII','conic-gradient(from 100deg,#19274b,#b483b6,#f5bcb1,#3d698d,#19274b)'],['Aether IX','radial-gradient(circle at 70% 20%,#f2f0e8,#9fb0d2 20%,#4f3975 60%,#161020)'],['Chroma X','linear-gradient(125deg,#f1beb7,#b15fa1,#5b60ad,#172d57)']];const cards=document.querySelector('#cards'),scene=document.querySelector('#scene'),center=document.querySelector('#center'),meter=document.querySelector('#meter'),cue=document.querySelector('#cue'),toast=document.querySelector('#toast');let progress=0,target=0,px=0,py=0,sx=0,sy=0,touchY=0,timer;const elements=items.map(([title,art],i)=>{let b=document.createElement('button');b.type='button';b.className='card';b.setAttribute('aria-label','Preview '+title);b.innerHTML='<div class="art"></div><span>'+title+'</span>';b.querySelector('.art').style.setProperty('--art',art);b.addEventListener('click',()=>{toast.textContent=title+' · visual preview';toast.dataset.show='true';clearTimeout(timer);timer=setTimeout(()=>toast.dataset.show='false',1800)});cards.append(b);return b});function clamp(n){return Math.max(0,Math.min(1,n))}function render(){progress+=(target-progress)*.075;sx+=(px-sx)*.055;sy+=(py-sy)*.055;let w=innerWidth,h=innerHeight,mobile=w<768;elements.forEach((el,i)=>{let start=i/items.length*.45,local=clamp((progress-start)/.55),z=(mobile?-1200:-1700)+local*(mobile?1550:2200),angle=i*137.5*Math.PI/180,x=Math.cos(angle)*w*(.28+i%3*.08)-sx*(mobile?20:45),y=Math.sin(angle)*h*(.26+i%2*.09)-sy*(mobile?20:45);el.style.transform=`translate3d(calc(-50% + ${x}px),calc(-50% + ${y}px),${z}px) rotateZ(${(i%2? -1:1)*(3+i%5*2)}deg)`;el.style.opacity=String(local<.18?local/.18:local>.82?(1-local)/.18:1);el.style.pointerEvents=local>.12&&local<.9?'auto':'none'});center.style.opacity=String(progress<.12?.6+progress/.12*.4:progress>.82?(1-progress)/.18:1);center.style.transform=`translate(-50%,-50%) scale(${.7+progress*.65})`;meter.style.setProperty('--progress',`${progress*100}%`);cue.style.opacity=String(clamp(1-progress/.13));requestAnimationFrame(render)}render();scene.addEventListener('wheel',e=>{e.preventDefault();target=clamp(target+e.deltaY*.00075)},{passive:false});scene.addEventListener('pointermove',e=>{px=e.clientX/innerWidth*2-1;py=e.clientY/innerHeight*2-1});scene.addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});scene.addEventListener('touchmove',e=>{e.preventDefault();let y=e.touches[0].clientY;target=clamp(target+(touchY-y)*.002);touchY=y},{passive:false});window.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='PageDown'){target=clamp(target+.08)}if(e.key==='ArrowUp'||e.key==='PageUp'){target=clamp(target-.08)}});
</script></body></html>
